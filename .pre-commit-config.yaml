repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--config-file=mypy.ini, .]
        pass_filenames: false
        additional_dependencies: [types-requests, types-python-dateutil, sqlalchemy2-stubs]

  - repo: local
    hooks:
      - id: coverage-threshold
        name: coverage-threshold
        entry: python -m pytest tests/ --ignore=tests/test_betting_idempotency.py --ignore=tests/test_comprehensive.py --cov=. --cov-config=.coveragerc --cov-report=term --cov-fail-under=55 -q
        language: system
        pass_filenames: false
        always_run: true
